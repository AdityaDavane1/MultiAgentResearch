<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Report</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; padding: 40px 20px; }
.container { max-width: 620px; margin: auto; }
.header { text-align: center; margin-bottom: 24px; }
h1 { font-size: 20px; font-weight: 500; color: #111; margin-bottom: 8px; }
.badge { display: inline-block; font-size: 12px; padding: 3px 10px; background: #eff6ff; color: #3b82f6; border-radius: 6px; }
.card { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 24px; line-height: 1.7; color: #444; font-size: 14px; white-space: pre-wrap; }
.back { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: #6366f1; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Research Report</h1>
    <span class="badge">Generated by AI</span>
  </div>
  <div class="card">{{ report }}</div>
  <a href="/" class="back">← New research</a>
</div>
</body>
</html>
