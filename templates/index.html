<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research Assistant</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.card { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 36px 32px; width: 100%; max-width: 380px; text-align: center; }
.icon { width: 48px; height: 48px; background: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 22px; }
h1 { font-size: 20px; font-weight: 500; margin-bottom: 6px; color: #111; }
p { font-size: 13px; color: #888; margin-bottom: 24px; }
input { width: 100%; padding: 11px 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; color: #111; }
input:focus { border-color: #6366f1; }
button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #6366f1; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
button:hover { background: #4f46e5; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔍</div>
  <h1>AI Research Assistant</h1>
  <p>Enter a topic and get a full research report in seconds.</p>
  <form action="/research" method="POST">
    <input type="text" name="topic" placeholder="e.g. LangGraph, AI agents..." required>
    <button type="submit">Generate report</button>
  </form>
</div>
</body>
</html>
